    ## Request

    NHS England want to know whether the pharmacist-led structured medication
    review (SMR) programme reduced unplanned hospital admissions among people
    aged 75 and over, and whether any integrated care board (ICB) areas stand
    out. Please compare 12-month unplanned admission rates between SMR
    recipients and matched non-recipients, overall and by ICB.

    ## Structure of the data pack

    ### Unplanned admissions within 12 months, by ICB

    Columns: ICB | SMR n | SMR admitted | Matched n | Matched admitted
    Row labels, in order: ICB A; ICB B; ICB C; ICB D; ICB E; ICB F; ICB G; ICB H; ICB I; ICB J; ICB K; ICB L; ICB M; ICB N; ICB O; ICB P; ICB Q; ICB R; ICB S; ICB T; Total
  reply: |-
    Analysis request: SMR programme and 12-month unplanned hospital admissions, people aged 75 and over

    Background and question
    NHS England want to know whether the pharmacist-led structured medication review (SMR) programme reduced unplanned hospital admissions among people aged 75 and over, and whether any integrated care board (ICB) areas stand out. Please run the analysis below on the summary table "Unplanned admissions within 12 months, by ICB" and write up the results. Do not look beyond the tables provided; report only what this analysis shows.

    Primary comparison
    The primary comparison is: SMR recipients aged 75 and over versus matched non-recipients aged 75 and over, on the outcome of having at least one unplanned hospital admission within 12 months, measured across the total study population (the Total row). This is the single prespecified confirmatory comparison.

    Unit of analysis
    The unit of analysis is the individual person aged 75 and over, classified as either an SMR recipient or a matched non-recipient.

    Outcome and denominators
    For each group and each ICB, report the proportion of people with at least one unplanned admission within 12 months, out of all people in that group. Specifically:

    - SMR recipients: number admitted divided by SMR n.
    - Matched non-recipients: number admitted divided by Matched n.

    Before interpreting the proportions, establish and document from the accompanying documentation what counts as an SMR recipient, when the 12-month follow-up window starts for each person, how the matched non-recipients were selected and on what variables they are matched, and whether "admitted" counts people with one or more admissions or counts admissions themselves. If the table in fact counts admissions rather than people, say so and describe the implications for interpretation. Do not assume any of these points.

    Number of comparisons and how to handle them
    The request implies 21 comparisons on the same outcome: 1 overall comparison (Total row) plus one comparison per ICB (20 ICBs). Handle them as follows:

    - The overall (Total row) comparison is the primary, confirmatory result.
    - The 20 ICB-level comparisons are secondary. They are not powered or designed tests of individual ICB effects, so present them with unadjusted point estimates and uncertainty intervals, and state explicitly that they are descriptive. Do not present them as confirmatory evidence that any specific ICB differs from the overall effect, and do not apply multiple-comparison corrections as if they were independent primary hypotheses; instead, note in the write-up that with 20 ICB-level comparisons some will appear different by chance, and interpret any standout ICBs in that light.

    Secondary and exploratory results
    The only secondary results available in this table are the ICB-level breakdowns described above. Report them as descriptive/exploratory. If you identify additional subgroup or breakdown possibilities in the data environment (for example by age band, care-home status or time period), do not run them as part of this request; list them as potential follow-ups instead, since nothing in the request prespecifies them.

    What would count as an answer
    The request is answered if, for each of the 21 comparisons, you can report: the number of people in each group, the number admitted in each group, the admission proportion in each group, and a measure of the difference between groups (risk difference and/or ratio) with an uncertainty interval. The primary answer is the overall difference between SMR recipients and matched non-recipients; the ICB-level table answers the secondary question of whether any ICBs stand out from that overall pattern.

    If the data cannot answer the question as asked
    State clearly if any of the following prevent an answer, and report what is available without drawing conclusions:

    - The follow-up window, matching method or recipient definition cannot be established from the documentation, in which case the comparison is not well defined and should be reported only as indicative.
    - Denominators are too small in some ICBs for stable proportions (for example if counts are suppressed or rounded for disclosure control); report which ICBs are affected and exclude them from the standout assessment rather than interpreting unstable estimates.
    - The Total row is not the sum of the ICB rows (for example if it includes an additional group or a different population); establish this first and describe what the Total row covers.
    - Matching quality cannot be assessed from the available information; note this as a caveat on any observed difference rather than attributing it to the SMR programme.

    In all cases, distinguish clearly between what the data show, what is uncertain, and what cannot be determined from the tables available to you.
