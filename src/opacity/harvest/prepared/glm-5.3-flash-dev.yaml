    To the analyst:

    **Research question (as submitted):** A diabetes self-management app was offered to 800 patients, with 800 matched patients receiving usual care. Did HbA1c improve among app users relative to usual care over twelve months?

    **Primary comparison.** The primary comparison is between the two arms (app vs usual care) on the outcome: change in HbA1c (mmol/mol) from baseline to twelve months. The question asks whether HbA1c *improved* among app users relative to usual care, so the estimand is the difference between arms in mean change from baseline to twelve months, with each arm's mean change reported alongside it. Report the difference with an appropriate measure of uncertainty and state the direction of the effect in mmol/mol (i.e. whether a lower value indicates improvement).

    **Unit of analysis.** The patient. Each patient contributes once to each arm-level summary.

    **Number of comparisons.** One primary comparison is pre-specified: app vs usual care on mean change in HbA1c, using the patient's twelve-month reading under the "any 12-month reading" source. All other comparisons implied by the tables are secondary or exploratory and should be reported as such. These include, at minimum: (a) the same comparison restricted to each source of twelve-month reading (in-app; GP), and (b) arm-by-source comparisons of reading availability. Please do not treat the source-specific change estimates as confirmatory tests of effectiveness; label them exploratory and report them descriptively, without implying that any single result stands as the answer to the research question.

    **Denominators.** For every rate or proportion, state who is counted out of whom. Specifically:
    - In the twelve-month availability table, establish from the data pack whether the denominator for each arm is the 800 patients offered that arm, or the patients in that arm with a baseline HbA1c recorded (per the sample stages table), and state which you have used. Do not assume one or the other.
    - Clarify whether "In-app reading" and "GP reading" are mutually exclusive categories that sum to "Any 12-month reading," or whether a patient could appear in both. Establish this from the structure or flag it in the write-up rather than assuming it; this affects whether source-specific estimates are based on overlapping groups.

    **Secondary and exploratory results.** The following should be reported descriptively as context, not as tests of the primary question: (a) the flow through the sample stages table, including how many patients in each arm reached baseline and twelve-month measurement; (b) twelve-month reading availability by arm and source; (c) mean change by arm and by source of reading. For each, give the denominator explicitly. Where the structure leaves a point open — for example, whether the three source rows within an arm are non-overlapping patient groups, or whether the counts across the three tables are internally consistent — establish what you can from the data pack and report what you could not establish, rather than assuming an interpretation.

    **What would count as an answer.** An answer to the research question is an estimate of the difference between arms in mean change in HbA1c from baseline to twelve months (mmol/mol), with uncertainty, based on patients with both a baseline and a twelve-month reading, together with a clear statement of the denominators and of differential attrition or reading availability between arms if present. If the data cannot answer the question as asked — for example, if twelve-month readings are too sparse, if the arm and source categories do not permit a single primary estimate, or if the denominators cannot be reconciled across the tables — say so explicitly, report the flow and availability figures you can produce, and state precisely what is missing rather than presenting an incomplete comparison as an answer.
