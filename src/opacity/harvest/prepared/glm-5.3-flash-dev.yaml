    Our HR director wants to know what effect the staff wellbeing programme
    had. Staff who applied were allocated by lottery, half to the programme
    and half to a waitlist. Which staff outcomes improved over the following
    year?

    ## Structure of the data pack

    ### Outcomes over 12 months, programme versus waitlist

    Columns: Outcome | Programme n | Programme mean | Programme SD | Waitlist n | Waitlist mean | Waitlist SD
    Row labels, in order: Sickness absence (days); Resignations per 100 staff; Stress score (0 to 40); GP visits; Overtime hours; Job satisfaction (0 to 10); Presenteeism days; Reported accidents per 100 staff
  reply: |-
    To the analyst:

    The researcher's question is: what effect did the staff wellbeing programme have on staff outcomes over the following year? Staff who applied were allocated by lottery, half to the programme and half to a waitlist. Please answer the question below using the table "Outcomes over 12 months, programme versus waitlist" only, and write up your findings for release.

    Primary comparison. The comparison is between staff allocated to the programme and staff allocated to the waitlist, on each of the eight listed outcomes, measured over the 12 months following allocation: sickness absence (days), resignations per 100 staff, stress score (0–40), GP visits, overtime hours, job satisfaction (0–10), presenteeism days, and reported accidents per 100 staff. The researcher named no single primary outcome, so no outcome should be elevated above the others.

    Unit of analysis. The unit is the individual staff member as randomised (programme versus waitlist), analysed in the two arms. The two "per 100 staff" outcomes are arm-level rates and should be reported as such.

    Number of comparisons. The request implies eight comparisons: programme versus waitlist on each of the eight outcomes, at a single 12-month period. There are no additional groups, areas or time points in this data pack. Because there is no prespecified primary outcome, treat all eight comparisons as exploratory: report the estimated difference between arms with a confidence interval for every outcome, regardless of statistical significance, and state plainly that eight comparisons were made. Do not select or emphasise outcomes on the basis of their results, and do not describe any single outcome as the primary finding.

    Secondary and exploratory results. The data pack contains no subgroup, area-level or time-by-time breakdowns, so no secondary analyses are possible or requested. Please do not run or report any unplanned breakdowns.

    Denominators. For the six mean-based outcomes (sickness absence days, stress score, GP visits, overtime hours, job satisfaction, presenteeism days), the denominator should be the staff allocated to each arm, and you should state what the reported n in each column covers — all staff randomised, or only those with complete outcome data. For the two rate-based outcomes (resignations per 100 staff, reported accidents per 100 staff), state explicitly who is counted in the numerator and who forms the denominator — for example, all staff randomised at baseline or staff remaining at each point — and over what period the rate is calculated. If the table or its accompanying documentation does not establish these denominators, report that they cannot be determined from the material available rather than assuming them.

    What counts as an answer. An answer consists of, for each of the eight outcomes, the direction and size of the programme-versus-waitlist difference, noting for each outcome which direction represents improvement (lower is better for sickness absence, resignations, stress, GP visits, overtime, presenteeism and accidents; higher is better for job satisfaction), together with the uncertainty around that difference. Please also establish, before interpreting the results, whether the table's means are 12-month levels or changes from a pre-programme baseline. The researcher asked which outcomes "improved", which implies change over time; if the table contains 12-month levels only, the analysis can compare the arms at 12 months and rely on the lottery allocation for baseline equivalence, and you should state this explicitly as a limitation rather than inferring improvement. As a further check, report whether the arm sizes are consistent with the described 1:1 allocation and whether the ns differ between outcomes, which would indicate missing outcome data.

    If the data cannot answer the question as asked. If the summaries do not permit a like-for-like comparison — for example, because denominators cannot be established, the ns indicate substantial differential missingness, or the measures cannot be interpreted as change over the year — say so directly. In that case, report which of the eight outcomes can and cannot be assessed, what the table does and does not support, and what additional data or clarification would be needed. Do not extend the analysis beyond the eight outcomes and two arms in the table.
