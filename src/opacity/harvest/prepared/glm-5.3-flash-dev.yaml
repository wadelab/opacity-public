    ## Request

    The city introduced a low-emission zone covering 11 of its 24 wards two
    years ago. The council would like to know whether the zone reduced
    children's asthma attendances at A&E, and whether any particular wards
    benefited.

    ## Structure of the data pack

    ### A&E attendances for asthma, children under 16, two years before and two years after

    Columns: Ward | In zone | Population under 16 | Attendances before | Attendances after
    Row labels, in order: Ward 1; Ward 2; Ward 3; Ward 4; Ward 5; Ward 6; Ward 7; Ward 8; Ward 9; Ward 10; Ward 11; Ward 12; Ward 13; Ward 14; Ward 15; Ward 16; Ward 17; Ward 18; Ward 19; Ward 20; Ward 21; Ward 22; Ward 23; Ward 24; All wards in zone; All wards outside zone
  reply: |-
    To the analyst:

    **Background.** The council wants to know whether the low-emission zone, introduced two years ago and covering 11 of the city's 24 wards, reduced children's asthma A&E attendances, and whether any particular wards benefited.

    **Primary comparison.** Compare the change in children's (under 16) asthma A&E attendances in wards inside the zone before versus after introduction, against the same change over the same periods in wards outside the zone. This is the single primary contrast: in-zone versus out-of-zone, after versus before (a difference-in-differences comparison). Use attendance rates as the outcome, not raw counts.

    **Unit of analysis.** The ward. Each row is a ward-level aggregate covering two years before and two years after; individual children are not identifiable and no child-level analysis is possible or required.

    **Denominators.** Express attendances as rates per child under 16 per ward, per period: attendances in a period divided by the under-16 population of that ward. The data pack provides a single "Population under 16" column per ward; please establish whether this figure refers to one time point or the period mid-point, and state clearly how you applied it to the before and after periods. Do not assume it applies to both equally; report any approximation this introduces. State the rate base explicitly in the write-up (e.g. attendances per 1,000 under-16s per two-year period).

    **Number of comparisons and how to handle them.**
    - Primary: one comparison (in-zone vs out-of-zone change over time), using the two aggregate rows or the ward-level data aggregated accordingly.
    - Secondary/exploratory: before-versus-after changes for each of the 24 wards, and specifically which of the 11 in-zone wards changed most or least. These are 24 individual ward comparisons (or 11 if restricted to in-zone wards). Treat them all as exploratory and report them descriptively — do not treat any single ward result as a confirmatory finding. If you use formal significance tests, account for multiplicity (e.g. report unadjusted estimates with a clear caveat, or apply a correction and say which you did), and make clear which results would and would not survive it.

    **Reporting of exploratory results.** Present ward-level before and after rates and the change for each ward in a table, with in-zone wards flagged. Rank or highlight in-zone wards only descriptively. Avoid naming "winner" wards as conclusions; note that the aggregate rows in the table are weighted summaries and state how they were derived.

    **What would count as an answer.** The question is answered if we can estimate, with appropriate uncertainty, the difference in the before-to-after change in asthma attendance rates between in-zone and out-of-zone wards, and state whether it is consistent with a reduction attributable to the zone. Note the limitations you should check and report rather than assume:
    - There are only two periods, so any pre-existing trend or seasonal pattern between periods cannot be separated from the zone effect from these tables alone. State this as a limitation and describe what the data can and cannot distinguish.
    - Ward populations are pre-16 residents only; establish whether attendances can be attributed to resident wards as the tables imply, or whether that needs to be verified before results are released.
    - Small counts: if any ward-period cell is very small, apply the secure environment's disclosure rules and report suppressed or rounded figures as required, noting where this limits ward-level conclusions.

    **If the data cannot answer the question as asked.** If, after inspection, the tables cannot support the primary comparison (for example because of incompatible denominators, unresolvable attribution issues, or suppressed counts), say so explicitly. In that case, report what the data can support — for example, descriptive before-versus-after changes by zone status — and set out what additional data or time points would be needed to answer the council's question properly. Do not present an inconclusive analysis as if it were an answer.
