    ## Request

    Please compare apprenticeship completion rates between further education
    colleges and independent training providers for the 2023 starter cohort.
    Completion is obtained by linking starter records to the achievement
    register.

    ## Structure of the data pack

    ### Sample stages

    Columns: Stage | n
    Row labels, in order: Starters in cohort; Linked to achievement register

    ### Linkage and completion by provider type

    Columns: Provider type | Starters | Linked | Not linked | Completed among linked
    Row labels, in order: FE college; Independent provider

    ### Linkage rate by learner age at start

    Columns: Age band | Starters | Linked
    Row labels, in order: 16 to 18; 19 to 24; 25 to 34; 35 and over
  reply: |-
    To the analyst:

    **Research question (primary comparison).** For the 2023 apprenticeship starter cohort, compare apprenticeship completion between two provider types: further education colleges and independent training providers. The outcome is completion, obtained by linking starter records to the achievement register.

    **Unit of analysis.** The individual learner starter record in the 2023 cohort.

    **Denominators — please define and report explicitly.**
    - Linkage rate: learners linked to the achievement register, divided by all starters in that group, per provider type.
    - Completion rate (primary definition): learners with a completion record, divided by starters who were linked to the achievement register, within each provider type.
    - Because unlinked starters have unknown completion status, also report a sensitivity measure: completers divided by all starters, treating unlinked starters as not completed. If the two definitions point in different directions, say so; do not treat the among-linked rate as definitive if linkage differs between provider types.

    **Number of comparisons and how to handle them.**
    - One primary, confirmatory comparison: FE college vs independent provider on the completion rate. Report the completion rate for each group, the difference between them, and appropriate uncertainty (confidence interval). Establish from the data what the comparable numbers of starters are per group; if counts are too small to release under disclosure control rules, say so and report only what can be released.
    - Secondary, exploratory results, to be reported descriptively (estimates with confidence intervals, no significance testing and no claims of statistical significance): (1) linkage rates by provider type; (2) linkage rates across the four age bands at start (16 to 18; 19 to 24; 25 to 34; 35 and over). These exploratory results should be clearly labelled as such in the write-up.
    - The sensitivity comparison using all starters as denominator should be reported alongside the primary result, not treated as an independent test.

    **Secondary and exploratory analyses.**
    - Linkage rate by age band is exploratory only; it describes whether linkage varies by learner age. The supplied tables do not cross-tabulate provider type by age, so you cannot assess from these tables whether the two provider types differ in age composition or whether linkage differs by age within provider type. Please state this limitation in the write-up rather than assuming the age pattern holds within each provider type.
    - Please also establish and report the sample sizes at each stage (starters, linked, not linked, completed) so the reader can see how much of the cohort each rate is based on.

    **What counts as an answer.** The question is answered by an estimate of the difference in completion between the two provider types, with uncertainty, plus the evidence on whether linkage rates are similar enough between the two groups for the among-linked comparison to be fair. If linkage rates differ substantially between provider types, the honest answer is that the primary comparison is biased in an unclear direction, and the write-up should say so and lean on the sensitivity definition.

    **If the data cannot answer the question as asked.** If the cohort, linkage or completion counts are too small for release, or the linkage rate is so low or so different between provider types that neither definition of completion is meaningful, report that clearly: state which part of the question can be answered (e.g. linkage rates and sample sizes only), which cannot, and why. Do not impute, adjust or reinterpret the results beyond what the tables support.
