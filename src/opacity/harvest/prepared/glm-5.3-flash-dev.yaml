    - The year-by-year rates requested above are descriptive context for that single primary comparison, not a series of formal pairwise tests. Please do not run multiple pairwise tests between years; if you think a formal test of trend across the ten years is appropriate, flag this in your write-up as an additional analysis rather than substituting it for the primary comparison. State how, if at all, you account for multiplicity.

