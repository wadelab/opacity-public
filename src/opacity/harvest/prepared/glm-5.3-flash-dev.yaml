    ## Request

    A local authority introduced free breakfast clubs in half of its primary
    schools in September. Did the breakfast club raise attendance, and for
    which pupils did it work best? Please look across year groups and free
    school meal (FSM) eligibility.

    ## Structure of the data pack

    ### Attendance (% of sessions) in the spring term, by year group and FSM eligibility

    Columns: Year group | FSM | Club n | Club mean | Club SD | No club n | No club mean | No club SD
    Row labels, in order: Reception (2 rows); Year 1 (2 rows); Year 2 (2 rows); Year 3 (2 rows); Year 4 (2 rows); Year 5 (2 rows); Year 6 (2 rows); All
  reply: |-
    To the analyst:

    **Background.** A local authority introduced free breakfast clubs in half of its primary schools in September. The researcher asks: did the breakfast club raise attendance, and for which pupils did it work best, looking across year groups and FSM eligibility. The data available to you are a single summary table: attendance (% of sessions) in the spring term, by year group and FSM eligibility, giving n, mean and SD separately for pupils in club schools and no-club schools, plus an "All" row.

    **Primary comparison.** The primary comparison is attendance (% of sessions attended) in the spring term between pupils in breakfast-club schools and pupils in no-club schools, overall (the "All" row). Note that the researcher's word "raise" implies change from before September, but the data provided cover the spring term only, with no pre-intervention period. The question as asked can therefore only be answered as: did club-school pupils have higher attendance than no-club pupils in the spring term. Please establish whether any pre-intervention attendance data are available in the environment; if they are, report the before/after comparison as well; if not, state plainly in the write-up that the data cannot show a rise in attendance, only a difference between club and no-club schools at one time point, and report that difference as the answer.

    **Unit of analysis.** The unit is the year-group × FSM-status × club-status cell: attendance is summarised as a mean percentage per cell, not as an individual pupil outcome. Please establish and report whether the n in each cell counts pupils or pupil-sessions, and whether each pupil contributes equally to the cell mean regardless of how many sessions they were on roll for.

    **Number of comparisons.** One comparison is primary: club vs no-club, all pupils. The remaining comparisons implied by the request are secondary: club vs no-club within each of the 7 year groups and 2 FSM statuses (14 subgroup comparisons), plus comparisons of the size of the club–no-club difference between FSM-eligible and non-eligible pupils, and across year groups. Handle these as exploratory: report all cells and all differences, including null and imprecise ones, rather than selecting significant results; present differences with their standard errors or confidence intervals where the summary statistics allow; and state in the write-up that the subgroup results are exploratory and have not been adjusted for multiple comparisons, or state what adjustment you applied.

    **Denominators.** Each attendance percentage should be defined as sessions attended out of all timetabled sessions in the spring term for the pupils in that cell. Please establish and report: whether denominators exclude any sessions (e.g. authorised absences or school closures) or count them as non-attended; how pupils who joined or left mid-term are handled; and whether FSM status refers to eligibility at any point or currently.

    **Secondary and context checks.** The subgroup results by year group and FSM are the exploratory answer to "for which pupils did it work best"; they should be reported as a complete table of club-minus-no-club differences, with cell sizes, and any very small cells flagged as unreliable. Please also establish, and report, whether club status is a school-level variable (all pupils in a club school exposed) and anything recorded about how the half of schools was chosen; without this, the comparison cannot be given a causal reading and should be described as a difference between selected groups.

    **What counts as an answer.** An answer is: (1) the size, direction and uncertainty of the spring-term attendance difference between club and no-club pupils overall; (2) whether that difference is larger for FSM-eligible pupils and whether it varies across year groups, reported as exploratory; (3) an explicit statement of what the design can and cannot support — in particular, that without baseline data the results show a difference, not a rise. If any cell cannot be estimated (for example, a subgroup with no club or no-club pupils), report it as not estimable rather than omitting it. If the data cannot answer the question as asked in any respect, report what the data do show and state precisely what is missing.
