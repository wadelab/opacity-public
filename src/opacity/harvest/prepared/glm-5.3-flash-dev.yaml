    ## Request

    The stop-smoking service offers support by telephone or in person. What
    were the six-month quit rates for the two delivery modes, and which
    performed better?

    ## Structure of the data pack

    ### Sample stages

    Columns: Stage | n
    Row labels, in order: Referred; Enrolled and set a quit date; Four-week outcome recorded; Six-month outcome recorded

    ### Enrolment and follow-up by delivery mode

    Columns: Mode | Enrolled | Six-month outcome recorded | Not contactable at six months
    Row labels, in order: Telephone; In person

    ### Six-month quit status among those with a recorded outcome

    Columns: Mode | Recorded | Quit | Still smoking
    Row labels, in order: Telephone; In person
  reply: |-
    To the analyst:

    The researcher's question is: for a stop-smoking service offering support by telephone or in person, what were the six-month quit rates for the two delivery modes, and which performed better?

    Primary comparison
    - Compare six-month quit status between clients supported by telephone and clients supported in person. The outcome is quit status at six months, taken from the table "Six-month quit status among those with a recorded outcome".
    - Primary rates: for each mode, quit as a proportion of the denominator defined below. Primary contrast: the difference between the two modes (report the direction of the difference and its uncertainty, e.g. a confidence interval, using whatever the secure environment permits).

    Unit of analysis
    - The individual client. Each client contributes once. Establish from the data whether any client received both delivery modes; if so, report how they are handled (this cannot be determined from the table structure alone). If clients are counted per episode rather than per person, state that.

    Denominators
    - State both denominators explicitly and designate one as primary before unblinding results:
      1. Among clients with a six-month outcome recorded (quit / (quit + still smoking), per mode).
      2. Among all enrolled clients, treating those not contactable at six months as not quit (quit / enrolled, per mode).
    - Recommend denominator 2 (enrolled) as the primary denominator, since it is unaffected by differential loss to follow-up, with denominator 1 reported alongside it. Justify or revise this choice only on methodological grounds, not on the basis of results.
    - Report the number and percentage not contactable at six months by mode, so readers can judge how much the two denominators diverge.

    Number of comparisons
    - This is one primary comparison: telephone versus in person on six-month quit status. The two mode-specific rates are components of it, not separate tests. Do not multiply tests across alternative denominators; present both denominators as descriptive sensitivity, with the single inference attached to the primary one.

    Exploratory results
    - The sample-flow table (Referred; Enrolled and set a quit date; Four-week outcome recorded; Six-month outcome recorded) is background and attrition description. Report it descriptively. Any exploration beyond the primary comparison — e.g. four-week attrition as a predictor of six-month loss, or differences in loss to follow-up between modes — should be labelled exploratory and reported without inferential emphasis.

    What counts as an answer
    - The question is answered if, for each mode, the number quit, the number still smoking, the number enrolled, and the number not contactable at six months are available, so that both denominators can be computed and the direction of the difference stated with an appropriate measure of uncertainty.
    - If the data cannot answer it as asked — for example, if recorded outcomes are too sparse for a stable estimate in either mode, if loss to follow-up is so high or so unequal between modes that the comparison is not meaningful, or if the tables cannot establish whether clients are unique to one mode — say so explicitly. Report the descriptive rates that are calculable, quantify the limitation (e.g. cell counts, attrition percentages), and state plainly that the comparison of which mode performed better cannot be made reliably, rather than forcing a conclusion.
