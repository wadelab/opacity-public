    Analysis request: new vs existing maths curriculum, end-of-year test score

    The researcher's question, in full: twenty-four Year 5 classes across six schools were assigned, twelve each, to a new maths curriculum or the existing one. Did pupils on the new curriculum score higher on the end-of-year test?

    PRIMARY COMPARISON
    Compare the 12 classes assigned to the new curriculum with the 12 classes assigned to the existing curriculum, on end-of-year maths score (the "Mean score" column). The primary estimand is the difference in average end-of-year score, new minus existing, in score points. The question is directional ("higher"), so report the sign and size of the difference, not just a significance level.

    UNIT OF ANALYSIS
    Classes were the unit of assignment, and the table is class-level (one row per class, with Pupils, Mean score, SD). The class (n = 24) is therefore the unit of analysis for inference; do not treat the data as 24 independent pupil-level observations or as individually randomized pupils. Because the question is about pupils, also report a pupil-weighted version of the arm difference (class means weighted by Pupils) as a secondary estimate, and note whether it differs from the unweighted class-level estimate.

    NUMBER OF COMPARISONS AND HOW TO HANDLE THEM
    There is one outcome (end-of-year score), two groups, and one time point, so the request implies one primary comparison; no multiplicity adjustment is needed for it. All school-level results are secondary and exploratory: up to six within-school curriculum contrasts and twelve school-by-curriculum cells. Report these as descriptive only, clearly labelled exploratory, without formal multiplicity adjustment and without selecting schools post hoc; note that each school contributes only four classes, so within-school contrasts rest on very few units.

    DENOMINATORS
    Each class mean is taken over the pupils in that class who sat the end-of-year test. Establish from the pack whether the "Pupils" column counts test-takers (the denominator of the mean) or pupils enrolled; if it counts enrolment and test-takers are not distinguished, say so and treat the denominator of each mean as unverified. Arm-level summaries: unweighted over the 12 classes per arm, and pupil-weighted over the summed Pupils per arm. School-level summaries: over the four classes per school, and over the classes per curriculum within each school as actually observed. Report the class counts and summed pupils behind every arm-level, school-level and school-by-curriculum figure, so each denominator is visible.

    CHECKS TO MAKE FIRST (THE STRUCTURE LEAVES THESE OPEN)
    - Confirm from the Curriculum column that the table holds 24 classes, 12 per curriculum, four per school, and record how the two arms are distributed within each school. If any school contributes classes to only one arm, or the counts differ from 12/12, report the actual allocation and flag that school and curriculum effects are then partly confounded.
    - Establish whether "SD" is the within-class SD of pupil scores. If so it may be used to describe within-class spread, but inference should remain at class level because classes, not pupils, were assigned.
    - Check for missing or zero Pupils, missing means, or ambiguous curriculum labels, and report any such rows rather than dropping them silently.

    WHAT COUNTS AS AN ANSWER
