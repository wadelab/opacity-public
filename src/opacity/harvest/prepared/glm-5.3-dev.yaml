    Unit of analysis. The individual 15-year-old respondent. The table aggregates individuals into four groups by self-reported daily use band; every comparison is between groups of individuals at one time point. There is no repeated measurement and no other unit in this pack.

    Comparisons implied, and how to handle them. One outcome (mean GAD-7), four groups, one time point, no areas. Four groups imply six pairwise contrasts. One is primary (Over 4 hours vs Under 1 hour). The other five pairwise contrasts, an overall test of any difference among the four bands (one-way ANOVA computed from the group summaries), and a test for a monotonic gradient across the ordered bands are secondary: eight statistical comparisons in total, one confirmatory and seven secondary. Report every secondary result with its estimate, 95% CI and unadjusted p-value, labelled secondary/exploratory, and note that these are unadjusted for multiplicity and cannot carry confirmatory weight. For the gradient, assign equally spaced scores 1 to 4 to the bands in the order given and state this choice; the bands differ in width and the end bands are open-ended, so any other scoring would need to be stated and justified.

