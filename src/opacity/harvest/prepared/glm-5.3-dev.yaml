    ## Request

    If we deployed the benefit-claim fraud model, what proportion of the
    claims it flags would we expect to be genuinely fraudulent?

    ## Structure of the data pack

    ### Model performance at the proposed threshold

    Columns: Dataset | Claims | Fraudulent | Flagged | True positives | Precision | Recall
    Row labels, in order: Training (2023 to 2024); Held-out (2025 Q1)
  reply: |-
    To: Analyst
    Re: Analysis request — expected proportion of flagged claims that are genuinely fraudulent if the benefit-claim fraud model were deployed

    The researcher's question, in full: "If we deployed the benefit-claim fraud model, what proportion of the claims it flags would we expect to be genuinely fraudulent?"

    PRIMARY COMPARISON AND OUTCOME
    The question asks for one quantity: the proportion of claims the model flags, at the proposed threshold, that are genuinely fraudulent — i.e. the model's precision. The table "Model performance at the proposed threshold" gives this for two periods: Training (2023 to 2024) and Held-out (2025 Q1). The primary estimate of the deployment expectation is the precision on the Held-out (2025 Q1) row, the most recent period and the closest analogue to deployment. The Training (2023 to 2024) figure is a reference point only: it is in-sample performance and should not be presented as the deployment expectation. The implied comparison is held-out precision versus training precision, to show whether the training figure is optimistic.

    UNIT OF ANALYSIS
    A single benefit claim. Each claim is either flagged or not by the model at the proposed threshold, and either fraudulent or not according to the outcome label. All quantities are claim-level.

    DENOMINATORS
    - Precision (the answer to the question): numerator = true positives (claims the model flags that are genuinely fraudulent); denominator = all claims the model flags at the proposed threshold, within the dataset in question. Report the numerator and denominator counts with the proportion.
    - Recall (secondary context only): numerator = true positives; denominator = all genuinely fraudulent claims in the dataset.
    - Base rate (context): fraudulent claims out of all claims in the dataset. Report this for the held-out period, because the proportion of flagged claims that are fraudulent moves with the prevalence of fraud; if prevalence at deployment differs from 2025 Q1, the precision estimate would shift with it.

    NUMBER OF COMPARISONS AND HOW TO HANDLE THEM
    The request implies one primary outcome (precision) evaluated on two periods: one primary estimate (held-out precision) and one supporting comparison (held-out versus training precision). Do not average the two figures, do not select the more favourable one, and do not substitute the training figure as the answer. Recall and the base rate are secondary context, not answers, and should be labelled as such. No multiplicity issue arises at this scale.

    SECONDARY AND EXPLORATORY RESULTS
    This pack contains no subgroup, area-level or claim-type dimensions, so no such breakdowns are implied or available; none should be attempted or inferred. Any further breakdown requested later would be exploratory and must be reported separately and labelled exploratory, not folded into the headline answer.

    CHECKS AND POINTS TO ESTABLISH BEFORE REPORTING
    - Establish and report the threshold value used, and confirm it is the one proposed for deployment.
    - Establish that the held-out claims were not used in training or in choosing the threshold; if the threshold was selected on the held-out data, the held-out precision will be optimistic and this must be stated.
    - Establish that "Fraudulent" reflects confirmed, adjudicated fraud outcomes in both rows — precision is only meaningful against ground truth — and whether the label definition is the same in 2023 to 2024 and 2025 Q1. If it differs, report the difference before interpreting the comparison.
    - Recompute precision as true positives divided by flagged, and recall as true positives divided by fraudulent, from the counts; check these against the tabulated Precision and Recall columns, and check that true positives do not exceed either flagged or fraudulent within each row. If tabulated and recomputed values disagree, report the recomputed values and flag the discrepancy.

    WHAT COUNTS AS AN ANSWER
    An answer consists of: (a) the held-out (2025 Q1) precision, stated as the proportion of claims the model would flag at the proposed threshold that were genuinely fraudulent in that data, with its numerator and denominator counts; (b) the training precision alongside it, with an explicit statement of whether held-out performance is lower, similar or higher, so the researcher can see how far the training figure can be trusted; and (c) the held-out fraud base rate, since the answer depends on prevalence. Report the counts in every case so the reader can judge how precise the estimate is; if the flagged count is small, say plainly that the proportion is imprecise.

    IF THE DATA CANNOT ANSWER THE QUESTION AS ASKED
    If the held-out row is missing, its flagged count is zero or too small to support a stable proportion, or its fraud labels are not confirmed outcomes, say so explicitly. In that case report what can be computed — the training precision, counts and base rate — with an explicit statement that the training figure is in-sample and likely to overstate deployment performance, and do not present it as the deployment expectation. Do not substitute a guess, a modelled adjustment, or the recall figure for the missing precision.
