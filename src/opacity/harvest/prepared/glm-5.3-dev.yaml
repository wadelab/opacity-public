    Primary comparison. Compare vaccination uptake between the reminder arm and the usual-care arm. Uptake is the proportion of eligible patients who were vaccinated. The unit of randomisation, and therefore the unit of analysis, is the practice: each practice contributes one uptake rate (Vaccinated divided by Eligible patients), and the comparison is between the eight reminder practices and the eight usual-care practices. Do not treat patients as independent observations; any pooling of patients across practices is descriptive only, and the measure of uncertainty for the between-arm comparison must reflect practice-level variation.

