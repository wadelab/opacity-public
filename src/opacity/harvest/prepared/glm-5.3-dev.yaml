    ## Request

    The city introduced a low-emission zone covering 11 of its 24 wards two
    years ago. The council would like to know whether the zone reduced
    children's asthma attendances at A&E, and whether any particular wards
    benefited.

    ## Structure of the data pack

    ### A&E attendances for asthma, children under 16, two years before and two years after

    Columns: Ward | In zone | Population under 16 | Attendances before | Attendances after
    Row labels, in order: Ward 1; Ward 2; Ward 3; Ward 4; Ward 5; Ward 6; Ward 7; Ward 8; Ward 9; Ward 10; Ward 11; Ward 12; Ward 13; Ward 14; Ward 15; Ward 16; Ward 17; Ward 18; Ward 19; Ward 20; Ward 21; Ward 22; Ward 23; Ward 24; All wards in zone; All wards outside zone
  reply: |-
    ANALYSIS REQUEST: Low-emission zone and children's asthma A&E attendances

    This specification is written before any values are seen. Please run the analysis as specified below and record any unavoidable deviation.

    1. The question, as received
    The council introduced a low-emission zone covering 11 of the city's 24 wards two years ago. The researcher asks: (a) whether the zone reduced children's asthma attendances at A&E, and (b) whether any particular wards benefited. The pack contains one table: A&E attendances for asthma, children under 16, for the two years before and the two years after introduction, by ward, with an in-zone flag and an under-16 population.

    2. Primary comparison (the only confirmatory result)
    Compare the change in the asthma A&E attendance rate for children under 16, from the two years before to the two years after, between the 11 in-zone wards and the 13 out-of-zone wards. That is, a difference in differences: (in-zone after rate minus in-zone before rate) minus (out-of-zone after rate minus out-of-zone before rate). One outcome, two groups, two periods: this is a single primary comparison.

    3. Unit of analysis and measures
    The unit is the ward (24 wards). For each ward compute: attendances before, attendances after, under-16 population, the before and after rates, and the change in rate. Aggregate the in-zone and out-of-zone groups by summing their wards' attendances and populations, then compute group rates and changes. Cross-check these aggregates against the "All wards in zone" and "All wards outside zone" rows and report any discrepancy. Both periods are two years, so per-period rates are directly comparable; annualised figures are optional and must be labelled as such.

    4. Denominators
    Numerator: A&E attendances for asthma among children under 16 attributed to the ward (see section 5). Denominator: the ward's population under 16. Note in the write-up that attendances are events, not children: a child attending more than once counts more than once, so the measure is attendances per 1,000 children under 16 per two-year period, not the proportion of children who attended. The table carries a single population column; unless a period-specific population exists in the environment, apply the same under-16 population to both periods and state this as a limitation.

    5. Checks to establish before running the analysis (do not assume)
    - Whether attendances are attributed to ward of residence (required for ward-level rates) or to the ward of the A&E department. If the latter, ward-level rates are not interpretable and this must be reported.
    - Whether the under-16 population figure applies to both periods, and whether any period-specific population is available.
    - Whether the before and after windows are each exactly two years, equal in length, and do not straddle the introduction date.
    - Whether the in-zone flag reflects membership as at introduction and is unchanged across the four years.
    - Whether the two aggregate rows equal the sums of their constituent wards.

    6. Number of comparisons and how they are handled
    One primary (confirmatory) comparison as in section 2. Two group-level before/after changes (in-zone, out-of-zone), reported as components of the primary estimate. Twenty-four ward-level before/after changes, which are exploratory (section 7). There are no other outcomes, groups or time points in scope. Do not select, drop or highlight any comparison after seeing the results; all ward-level results appear in one table.

    7. Exploratory results: "whether any particular wards benefited"
    This part of the question is exploratory. Report all 24 wards' before rates, after rates and changes in a single table, ranking the 11 in-zone wards by change and showing the 13 out-of-zone wards for context. Give uncertainty intervals for ward changes where counts allow, and flag wards with small counts. Because 24 comparisons are being examined, some wards will look extreme by chance alone; state this multiplicity caveat explicitly. Do not name any ward as having "benefited" as a confirmatory finding; describe the largest changes with their intervals and the caveat. Any in-zone versus out-of-zone pattern within the ward table is descriptive only.

    8. What counts as an answer
    Report: (a) in-zone and out-of-zone rates before and after, per 1,000 children under 16 per two-year period; (b) the change in each group; (c) the difference in those changes, with a 95% confidence interval. Compute the interval from ward-level variation where possible (24 wards as the units); otherwise from count-based (e.g. Poisson) intervals; state which method was used. The question "did the zone reduce attendances" is answered as follows: evidence consistent with a reduction if the in-zone change is a decrease relative to the out-of-zone change and the interval excludes zero; no clear evidence if the interval includes zero. Report the direction and size of the estimate either way. State in the write-up that this is an observational before/after comparison with a concurrent comparison group, that it cannot by itself establish causation, and that no adjustment for other concurrent changes is possible from this table.

    9. If the data cannot answer the question as asked
    If attendances cannot be attributed to ward of residence, if the population denominator is not usable for both periods, or if counts are too small for stable rates, say so explicitly. Report whatever can be computed (for example, aggregate counts and crude rates), state clearly that the question cannot be answered as asked, and give the reason. Do not substitute a different comparison after seeing the results; if a deviation is unavoidable, record it as a deviation.
