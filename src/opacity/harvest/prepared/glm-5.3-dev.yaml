    ## Request

    The stop-smoking service offers support by telephone or in person. What
    were the six-month quit rates for the two delivery modes, and which
    performed better?

    ## Structure of the data pack

    ### Sample stages

    Columns: Stage | n
    Row labels, in order: Referred; Enrolled and set a quit date; Four-week outcome recorded; Six-month outcome recorded

    ### Enrolment and follow-up by delivery mode

    Columns: Mode | Enrolled | Six-month outcome recorded | Not contactable at six months
    Row labels, in order: Telephone; In person

    ### Six-month quit status among those with a recorded outcome

    Columns: Mode | Recorded | Quit | Still smoking
    Row labels, in order: Telephone; In person
  reply: |-
    Analysis request: six-month quit rates by delivery mode, and which mode performed better

    PRIMARY COMPARISON
    Compare the six-month quit rate of clients supported by telephone with that of clients supported in person, on the outcome "quit at six months". "Performed better" means the higher six-month quit rate on the primary definition below. Reach and follow-up are reported as context only, not as part of the verdict.

    UNIT OF ANALYSIS
    The individual enrolled client. Before running anything, establish whether each client is counted once (one enrolment, one mode) or whether clients can appear more than once or in both modes. If the tables allow, base rates on unique clients; if they do not allow this, flag it as a limitation rather than assuming clients are unique.

    DENOMINATORS — state every rate as "who, out of whom", with counts shown alongside proportions:
    - Primary quit rate: clients recorded as "Quit" at six months, out of clients with a recorded six-month outcome, separately by mode (Quit / Recorded from the quit-status table).
    - Sensitivity quit rate: Quit / Enrolled by mode, i.e. counting only recorded quits as quits and treating everyone without a recorded outcome as not a quitter. Report this alongside the primary rate.
    - Follow-up rate (context): Recorded / Enrolled by mode, and Not contactable / Enrolled by mode.
    - Referral funnel (descriptive): each stage count as a proportion of all referred. Note that the stage table is not broken down by mode, so mode-specific attrition before enrolment cannot be computed; say this rather than assuming it.

    NUMBER OF COMPARISONS AND HANDLING
    The request implies one primary comparison (telephone vs in person on the primary quit rate) and one secondary comparison (telephone vs in person on follow-up/attrition). Everything else is descriptive. No multiplicity adjustment is needed for a single pre-specified primary comparison; do not run or emphasise additional tests.

    EXPLORATORY / SECONDARY RESULTS
    The follow-up and attrition figures by mode are exploratory. They matter because differential loss to follow-up could make the primary comparison misleading. Report them descriptively, clearly labelled exploratory, and use them to interpret the primary result — for example, if one mode has much lower follow-up, say so and discuss how the answer differs under the two denominators. Do not present them as verdicts on which mode performed better.

    CONSISTENCY CHECKS
    Verify that the "Recorded" counts in the quit-status table match the "Six-month outcome recorded" counts in the enrolment table for each mode, and that Quit + Still smoking equals Recorded. If the tables disagree, report the discrepancy and do not proceed to a verdict until it is resolved or explained.

    WHAT COUNTS AS AN ANSWER
    An answer is: the two primary quit rates with their counts, the absolute difference between them, and a plain statement of which mode was higher — or that they were equal or indistinguishable given the numbers. If the environment's rules permit, add a 95% confidence interval for the difference or an equivalent measure of uncertainty; if not, state the difference with its counts and note that uncertainty cannot be quantified. Declare a mode "better" only if the direction is clear and the difference is large relative to the numbers involved; otherwise report "no clear difference".

    IF THE DATA CANNOT ANSWER IT AS ASKED
    If either mode has no recorded six-month outcomes, or so few that the rate is unstable, or if follow-up differs so much between modes that the quit rates are not comparable under any denominator, say so explicitly: report what is available (counts, follow-up rates), state that the question of which mode performed better cannot be answered from these tables, and do not name a winner. If the two denominators give conflicting directions, report both and state that the answer depends on the definition of the quit rate, rather than silently choosing one.
