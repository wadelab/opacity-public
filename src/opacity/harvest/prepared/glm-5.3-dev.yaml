    ## Request

    A local authority introduced free breakfast clubs in half of its primary
    schools in September. Did the breakfast club raise attendance, and for
    which pupils did it work best? Please look across year groups and free
    school meal (FSM) eligibility.

    ## Structure of the data pack

    ### Attendance (% of sessions) in the spring term, by year group and FSM eligibility

    Columns: Year group | FSM | Club n | Club mean | Club SD | No club n | No club mean | No club SD
    Row labels, in order: Reception (2 rows); Year 1 (2 rows); Year 2 (2 rows); Year 3 (2 rows); Year 4 (2 rows); Year 5 (2 rows); Year 6 (2 rows); All
  reply: |-
    To the analyst, re: breakfast clubs and attendance.

    The requester's question, in full: the local authority introduced free breakfast clubs in half of its primary schools in September; did the breakfast club raise attendance, and for which pupils did it work best, looking across year groups and free school meal (FSM) eligibility? The data pack contains one summary table, "Attendance (% of sessions) in the spring term, by year group and FSM eligibility", with columns Year group | FSM | Club n | Club mean | Club SD | No club n | No club mean | No club SD, and rows for Reception to Year 6 (two rows each) plus an "All" row. Please specify and run the following.

    1. Primary comparison. Compare spring-term attendance between the "Club" and "No club" groups using the "All" row: report both n's, means and SDs; the difference in mean attendance in percentage points (Club minus No club); its standard error and 95% confidence interval computed from the n, mean and SD in each group; and a two-sample comparison allowing unequal variances. Report the direction and size of the difference, not just significance. The requester set no minimum size of difference, so present the estimate and interval and state whether the interval excludes zero.

    2. Unit of analysis and grouping. The outcome is pupil-level: each pupil's attendance as a percentage of sessions, summarised by group. The clubs were offered at school level, so the intended comparison is pupils in club schools versus pupils in non-club schools. Before running anything, establish from the data environment and state in the write-up: (a) whether "Club"/"No club" means all pupils in schools that do/don't offer a club, or only pupils who did/didn't attend one — these answer different questions, and the requester's is the school-offer one; (b) whether each group mean is the mean of pupil-level percentages or a pooled rate (sessions attended divided by sessions possible), since this changes the weighting; (c) what the two rows within each year group denote under "FSM" (expected: eligible and not eligible), and the definition and timing of eligibility used; (d) whether the "All" row pools all pupils or averages the rows, and whether it is consistent with the 14 rows above it.

    3. Denominators. State who is counted and out of whom. Attendance: pupils on roll in the authority's primary schools, Reception to Year 6, during the spring term, with each pupil's rate being sessions attended out of the sessions they were expected to attend that term; n is the number of such pupils per group. Establish and report whether pupils with no expected sessions in the term are excluded and how mid-term joins or leavers are handled. FSM subgroups: eligible and non-eligible pupils within the same schools and term, each with their own n.

    4. Number of comparisons and handling. The request implies one outcome (attendance) at one time point (spring term). It implies one primary, confirmatory comparison (Club vs No club, all pupils) and up to 23 secondary ones: 14 within year-group x FSM cells, plus, if derived, 7 year-group marginals and 2 FSM marginals. Treat only the "All" comparison as confirmatory. Run and report every secondary comparison with its n and confidence interval; do not select among them. Note in the write-up that with this many comparisons some will look notable by chance; if you apply any formal adjustment, name it and also give unadjusted intervals.

    5. Exploratory subgroup results. To address "for which pupils did it work best", compute the Club-minus-No-club difference (with interval) within each year group, each FSM group, and each year-group x FSM cell, and compare the size of these gaps across subgroups. Report all of them, including small, null and negative gaps, and flag any pattern (e.g., a larger gap for FSM-eligible pupils) as exploratory, noting where cell sizes make estimates imprecise. Do not single out a "best" group unless the difference between gaps is large relative to its uncertainty, and even then label it exploratory.

    6. What counts as an answer, and if the data cannot answer it. An answer is: the estimated difference in mean spring attendance between Club and No club pupils, in percentage points, with its 95% interval, and a plain statement of whether Club pupils attended more, less, or indistinguishably. Two things must be carried into the write-up. First, the pack holds spring-term data only, with no pre-introduction attendance, so the comparison is post-introduction between club and non-club schools: it can show whether Club pupils had higher attendance, but cannot by itself show that the clubs raised it — state this limitation explicitly rather than answering the causal question as asked. Second, the table carries no school-level information, so intervals computed from it treat pupils as independent even though they are clustered within schools; note this. If the Club/No club definition, the FSM row labels, or the "All" row cannot be established, or the summary statistics are inconsistent, report what can be computed, say precisely which part of the question the data cannot answer, and do not fill gaps with assumptions. If a subgroup cell is too small to estimate precisely, say so rather than omitting it.

    The write-up should cover, in order: the overall Club vs No club difference; results by year group; results by FSM eligibility; and the combined year-group x FSM picture.
