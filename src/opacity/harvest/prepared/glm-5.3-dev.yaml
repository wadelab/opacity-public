    One comparison only: our organisation's 30-day emergency readmission rate for last year, on the standard definition, against the fixed external benchmark of 12.0%. One outcome, one period, one organisation, one benchmark. Treat it as a single pre-specified comparison: report it as asked, and do not add further comparisons (against other thresholds, other denominators, or other measures) to the answer. The benchmark is an external figure; it is not recomputable from this pack and should simply be compared against.

    UNIT OF ANALYSIS
    The index admission episode, and specifically the live discharge from it — not the patient. Each live discharge from an index admission is one unit at risk of the outcome. The rate is computed at organisation level, pooling all index admissions in the period.

    NUMERATOR AND DENOMINATOR
    Numerator: the count of emergency readmissions within 30 days of a live discharge from an index admission (the "Emergency readmission within 30 days" row).
