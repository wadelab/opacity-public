    4. Number of comparisons and how to handle them
    The request implies one primary comparison (overall rate, digital versus not yet) and three exploratory subgroup comparisons (digital versus paper within acute medical, within surgical, and within elderly care). Handle the primary comparison as in section 1. Handle the three subgroup comparisons as exploratory: report rates and rate differences with intervals, label them exploratory, note that three comparisons are being made and that each rests on fewer wards and admissions than the overall figure, and do not treat any of them as a test of the main question. Whether the digital-versus-paper difference varies by ward type is also exploratory: describe any pattern, but do not build a headline claim on it.

    5. Confounding
    The request does not say how wards were chosen for early rollout. Establish what is known about adoption order; if it cannot be shown to be independent of ward characteristics, treat the comparison as potentially confounded. Use Table 2 to check whether the overall difference persists within ward types or is explained by differences in ward-type mix between the two groups, and report what you find. If the pack allows an overall comparison standardized to the ward-type mix, report it; if not, say so.

    6. What would count as an answer, and what to report if the data cannot answer it as asked
    - An answer to the question as asked requires a lower unplanned ICU transfer rate after adoption than before, within the same wards. If before-and-after data exist, report that comparison with its interval.
    - With status-group data only, a lower rate in digital wards than in not-yet wards, with the interval for the difference excluding zero, is consistent with a benefit but does not establish that the score reduced transfers, because the groups may differ for other reasons. The write-up should say exactly this.
