    Primary comparison
    - Compare the 12 specialties on weeks from referral to first appointment among patients seen last quarter, using median weeks as the primary measure.
    - Deliverable: a ranking of the 12 specialties by median weeks, and a named set of longest-wait specialties. Before looking at the values, fix and state the criterion for "longest waits" (for example, the top three specialties by median weeks, or all specialties above a stated cut-point in weeks) and apply exactly that criterion.

    Unit of analysis
    - The specialty. Each row summarises the patients seen in that specialty last quarter. The pack holds no patient-level data, so no patient-level analysis is possible, and no all-specialty aggregate is required. If you report any overall figure, do not average the specialty medians; note that a patient-weighted overall figure cannot be derived from this table.

    Number of comparisons and how to handle them
    - One primary outcome (median weeks) across 12 specialties: 12 descriptive statistics, with a ranking implying up to 66 pairwise contrasts between specialties. Three secondary measures per specialty (lower quartile, upper quartile, over 18 weeks) add a further 36: 48 descriptive statistics in total. One time period only (last quarter); no area breakdown.
