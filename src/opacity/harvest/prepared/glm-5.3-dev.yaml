    WHAT COUNTS AS AN ANSWER

    Report: each group's mean mg per PCU at baseline and in the post period, with farms, farm-months where applicable, and SDs; the change within each group; the difference in changes, in mg per PCU and as a percentage of the advisory group's baseline mean; and, insofar as the summaries allow, standard errors and 95 per cent intervals for the group means and changes, stating the assumptions (independent farms, approximate normality). A formal interval for the difference in changes requires the variability of per-farm changes, which these summaries may not provide; if it does not, give the point estimate of the difference in changes with intervals for each group's change, and say that a formal interval for the difference cannot be computed from these tables.

