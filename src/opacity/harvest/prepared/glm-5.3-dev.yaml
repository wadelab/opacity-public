    ## Request

    Our HR director wants to know what effect the staff wellbeing programme
    had. Staff who applied were allocated by lottery, half to the programme
    and half to a waitlist. Which staff outcomes improved over the following
    year?

    ## Structure of the data pack

    ### Outcomes over 12 months, programme versus waitlist

    Columns: Outcome | Programme n | Programme mean | Programme SD | Waitlist n | Waitlist mean | Waitlist SD
    Row labels, in order: Sickness absence (days); Resignations per 100 staff; Stress score (0 to 40); GP visits; Overtime hours; Job satisfaction (0 to 10); Presenteeism days; Reported accidents per 100 staff
  reply: |-
    ANALYSIS REQUEST: EFFECT OF THE STAFF WELLBEING PROGRAMME

    Background. Staff who applied to the wellbeing programme were allocated by lottery, half to the programme and half to a waitlist. The HR director wants to know what effect the programme had: which staff outcomes improved over the following 12 months. The pack contains one summary table, "Outcomes over 12 months, programme versus waitlist", giving n, mean and SD for each arm for eight outcomes.

    1. Primary comparison. Programme arm versus waitlist arm, compared as allocated by the lottery (intention-to-treat: group staff by the arm they were allocated to, regardless of uptake or attendance). One contrast per outcome, on the 12-month figure, for each of the eight outcomes in the table: sickness absence (days); resignations per 100 staff; stress score (0 to 40); GP visits; overtime hours; job satisfaction (0 to 10); presenteeism days; reported accidents per 100 staff.

    2. Unit of analysis. The individual staff member. Confirm from the study design that the lottery allocated individuals rather than teams or departments; the summary tables carry no cluster information. If allocation was clustered, say so and note that the summary SDs cannot reflect it.

    3. Number of comparisons and how to handle them. Eight comparisons in total: eight outcomes, each with a single programme-versus-waitlist contrast. There are no time-point, area or subgroup comparisons in the pack. Treat the eight as one pre-specified family: report the between-arm difference for every outcome with a 95% confidence interval, adjust for multiplicity across the eight (e.g. Holm or Benjamini-Hochberg at 5%), and state which results hold after adjustment and which do not. Do not drop or highlight outcomes after seeing the results. If the HR director can rank the outcomes by importance beforehand, record that ranking before results are seen and report both adjusted and unadjusted results.

    4. Direction of "improvement". State explicitly, per outcome, that improvement means: fewer sickness absence days; fewer resignations per 100 staff; a lower stress score; fewer GP visits; fewer overtime hours; a higher job satisfaction score; fewer presenteeism days; fewer reported accidents per 100 staff.

    5. Denominators. For each outcome, report who is counted and out of whom.
    - Person-level outcomes (sickness absence days, stress score, GP visits, overtime hours, job satisfaction, presenteeism days): the mean is per staff member; the denominator is staff allocated to that arm with a recorded outcome over the 12 months (the n in the table). Establish and report whether n counts staff or events, whether non-responders are excluded, and whether each outcome is measured at 12 months, cumulatively over the 12 months, or at another point.
    - Rate outcomes (resignations per 100 staff, reported accidents per 100 staff): the numerator is events during the 12 months; the denominator is staff allocated to the arm, per 100. Establish and report whether staff leaving for other reasons are removed from the denominator, whether the rate is annualised, and whether the table's mean and SD summarise per-person event counts or a single arm-level rate. If the latter, an SD-based interval is not meaningful: derive the interval from the underlying counts and denominator if available, and if not, report the rate difference without an interval and say why.

    6. Secondary and exploratory results. The pack contains no subgroup, area-level or other secondary breakdowns. Any further cuts (for example by grade, department, sex or baseline absence) are exploratory: if they can be produced at all, label them exploratory, report them separately from the primary results with unadjusted intervals only, and do not use them to answer the HR director's question.

    7. What counts as an answer. For each of the eight outcomes, report: n, mean and SD for each arm; the difference (programme minus waitlist) in the outcome's own units (for the two rates, the difference per 100 staff); a 95% confidence interval for that difference; and the multiplicity-adjusted result. An outcome counts as "improved" if the adjusted comparison favours the programme in the direction listed in point 4. Close with one plain summary: which outcomes improved, which showed no difference, and which way any non-significant differences pointed.

    8. If the data cannot answer the question as asked, say so plainly and specify what is missing. In particular:
    - The pack has no baseline measurements, so "improved over the year" can only be answered as a between-arm difference over the 12 months, which the lottery makes an unbiased estimate of the programme effect; within-person change from baseline cannot be assessed from this pack. State this in the write-up.
    - Establish whether waitlist staff received the programme within the 12-month outcome window. If they did, the between-arm difference understates the programme's effect; label the estimate accordingly.
    - If any n is events rather than staff, a rate lacks a usable denominator, or an outcome's measurement window cannot be established, report that the comparison for that outcome cannot be made as asked and what would be needed to make it.
    Report all eight outcomes, including any that cannot be analysed, with the reason. Do not substitute proxies or omit outcomes silently.
