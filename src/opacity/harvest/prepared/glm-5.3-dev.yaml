    To the analyst

    The researcher's question, in full: which of our two hospitals has the lower 30-day mortality after elective colorectal resection, and should the commissioning board be concerned about either? Your job is to specify and run the analysis on the two summary tables, and write it up for release. Please do the following.

    Cohort, period and definitions to establish before running anything
    - Confirm the period the tables cover and that it is the same for both hospitals. If the periods differ, report that the comparison is not interpretable as asked.
    - Confirm that both tables are restricted to elective colorectal resections, as the question specifies. If they include other operations, say so; if you cannot restrict them, report the comparison as not answering the question as asked.
    - Confirm the counting rule behind "Deaths": presumably deaths from any cause within 30 days of the operation, including deaths after discharge. State the rule you find.
    - Confirm whether "Operations" counts operations or unique patients, and whether a patient can contribute more than one operation in the period. Take the operation as the unit of analysis, matching the tables, and note any repeats.
    - Check that the ASA-grade table accounts for the whole of the first table: grade-specific operations and deaths should sum to each hospital's totals. If some operations lack an ASA grade, report how many, keep them in the overall comparison, and note that the grade-specific analyses cover graded operations only.

    Primary comparison (one only)
    - Outcome: 30-day mortality rate, defined as deaths within 30 days divided by all elective colorectal resection operations at that hospital over the period covered.
    - Compare Hospital A with Hospital B on this single outcome. Report each hospital's rate with its numerator and denominator, a 95% confidence interval (exact or Wilson) for each rate, and the difference in rates with an interval. State whether the observed difference is within the range compatible with chance given the number of deaths.
    - What counts as an answer: the hospital with the lower rate is the answer to "which is lower", but only if the difference is not compatible with the two being equal; if it is, report that the data establish no clear difference rather than naming a winner on a small margin.

    On "should the commissioning board be concerned about either"
    - These tables contain no external benchmark, target or national comparator, so they cannot by themselves judge whether either hospital's absolute level is acceptable. Report what they can support: the two rates with intervals, and whether one hospital is clearly higher than the other. If one hospital's rate is both materially higher than the other's and not compatible with chance, flag that as the only finding in this pack that could ground concern, and state explicitly that a judgement of concern in absolute terms requires a comparator the pack does not contain. If the researcher or board can supply a benchmark, compare against it and say which; otherwise do not invent a threshold.

    Secondary and exploratory analyses (label as exploratory throughout)
    - ASA-grade-specific rates: for each of grades I to IV, deaths divided by operations for each hospital (8 rates). Report counts alongside rates; note that small cells make these unstable.
    - Within-grade comparisons: Hospital A versus Hospital B within each ASA grade (4 comparisons). Treat as exploratory and hypothesis-generating only; if you test them, state that four unadjusted comparisons cannot be read as confirmatory.
    - Case mix: compare the two hospitals' distribution of operations across ASA grades, to show whether any crude difference could reflect case mix rather than performance.
    - If the data allow, report one ASA-adjusted overall comparison (for example, both hospitals' rates standardised to the pooled grade distribution) as a secondary check on the primary result; state the method and standard population used.
    - Any within-hospital pattern across grades is descriptive only.

    Handling of multiplicity
    - The request implies one primary comparison: two hospitals, one outcome, one period. Everything by ASA grade is secondary: up to 4 pairwise comparisons, 8 stratum rates and one case-mix description. Report all secondary results together in a single exploratory section, with a note that they are unadjusted for multiplicity, often based on small numbers, and do not constitute evidence about either hospital on their own.

