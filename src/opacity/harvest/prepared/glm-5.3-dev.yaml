    ## Request

    Please compare apprenticeship completion rates between further education
    colleges and independent training providers for the 2023 starter cohort.
    Completion is obtained by linking starter records to the achievement
    register.

    ## Structure of the data pack

    ### Sample stages

    Columns: Stage | n
    Row labels, in order: Starters in cohort; Linked to achievement register

    ### Linkage and completion by provider type

    Columns: Provider type | Starters | Linked | Not linked | Completed among linked
    Row labels, in order: FE college; Independent provider

    ### Linkage rate by learner age at start

    Columns: Age band | Starters | Linked
    Row labels, in order: 16 to 18; 19 to 24; 25 to 34; 35 and over
  reply: |-
    To the analyst:

    Please run and write up the following analysis, based on the summary tables in the data pack.

    PRIMARY COMPARISON

    Compare apprenticeship completion rates for the 2023 starter cohort between further education (FE) colleges and independent training providers. Completion is obtained by linking starter records to the achievement register. This is one primary comparison: one outcome (completion), two groups (provider type), one cohort (2023 starters).

    For each provider type, report: starters, linked to the register, not linked, and completed among linked; the completion rate among linked (completed / linked); and the absolute difference in percentage points between the two provider types, with its direction.

    Also report the completion rate among all starters (completed / all starters) for each provider type, but only if unlinked records can legitimately be treated as not completed. Establish from the data environment whether that treatment is valid; if it is not, or cannot be established, report only the rate among linked and say so explicitly.

    UNIT OF ANALYSIS

    The unit is a single starter record in the 2023 cohort. Establish whether the tables count one record per learner or per aim/programme, and whether a learner can appear more than once. If so, state how the tables handle this and keep the counting consistent across all rates. Do not assume.

    DENOMINATORS (who is counted, out of whom)

    - Linkage rate, overall and by provider type: starters linked to the achievement register, out of all starters in the cohort (or in that provider type).
    - Completion rate among linked (primary): completions out of starters linked to the register, within each provider type.
    - Completion rate among all starters (co-reported, conditional on the assumption above): completions out of all starters in each provider type.
    - Use the sample-stages table to report the overall cohort size and overall linkage rate, and check that the provider-type table sums to the same totals. Report any discrepancy.

    NUMBER OF COMPARISONS AND HOW TO HANDLE THEM

    - One primary comparison: completion rate, FE college vs independent provider. No multiplicity adjustment is needed for a single comparison; report it as the headline result.
    - One supporting data-quality comparison: linkage rate, FE college vs independent provider. This is not a second headline test. It is reported so the reader can judge whether linkage is comparable across provider types, since differential linkage would bias a comparison of completion among linked.
