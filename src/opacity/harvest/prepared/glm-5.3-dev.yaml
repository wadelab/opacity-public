    What these data can and cannot answer. The survey is cross-sectional: use and anxiety are measured once, in the same individuals. It can answer whether 15-year-olds who report heavy use also report higher average anxiety than those reporting light use, and whether the average rises across the use bands. It cannot show that heavy use increases anxiety: there is no temporal ordering, no within-person change, and no covariates in this pack, so no adjusted or causal analysis is possible. Present all results as associations and state this limitation explicitly; do not describe findings as effects of social media use on anxiety. Note also that the sample is 15-year-olds, so describe the group as such rather than "teenagers" generally, and that use is self-reported and banded, so misclassification is possible but cannot be quantified from this pack.

