    ANALYSIS REQUEST: Sickness absence and contracted working pattern

    Researcher's question (keep intact in the write-up): Does remote working reduce sickness absence? The HR system records contracted working pattern and sickness days for 5,600 staff over the last year.

    Tables available: "Sickness absence by working pattern" (Pattern, Staff, Mean sickness days, SD; rows: Fully remote, Hybrid, On site) and "Sickness absence by working pattern and job family" (Job family, Remote n, Remote mean, Hybrid n, Hybrid mean, On-site n, On-site mean; rows: Operational, Facilities, Administrative, Professional, Management).

    1. Primary comparison
    Compare fully remote staff with on-site staff on mean sickness days per staff member over the last year. "Reduce" means the fully remote mean is lower than the on-site mean. Hybrid is an intermediate category; comparisons involving hybrid are secondary (section 4). The data cover a single period, so there is no before/after or time-trend comparison in these tables and none should be attempted. Note in the write-up that the grouping is by contracted working pattern as recorded in the HR system, not by days actually worked remotely.

    2. Unit of analysis
    The unit is the individual staff member. The outcome for each staff member is recorded sickness days over the last year; the tables summarise this as the mean across the staff counted in each cell.

    3. Denominators
    Each mean is sickness days per staff member counted in that cell: staff with that contracted pattern, out of all staff recorded in the HR system for the last year. Before reporting, establish and state:
    - whether the Staff/n counts include staff with zero recorded sickness days; the means must be over all staff in the pattern, not only those with at least one absence day. If the tables cannot confirm this, say so.
    - whether the Staff counts in the by-pattern table sum to 5,600, and whether the job-family ns sum to the corresponding by-pattern Staff counts; report any shortfall and, if the environment allows, its reason (e.g. missing pattern or missing absence record).
    - whether each staff member has a single contracted pattern for the whole year or can change pattern during the year; how part-year or pattern-changing staff are classified; and whether their sickness days are pro-rated. Report the rule used.

    4. Comparisons implied and how to handle them
    There is one outcome (mean sickness days) and one period, so all multiplicity comes from the group and subgroup structure. The request implies 18 comparisons:
    - 1 primary: fully remote vs on-site. Report both means, the difference (fully remote minus on-site), and a 95% confidence interval computed from the n, mean and SD in the by-pattern table (standard two-sample comparison from summary statistics). State whether the interval excludes zero, and note that it relies on the mean/SD summary; flag any indication that the summary is unreliable (e.g. an SD exceeding its mean, which is possible for skewed absence counts).
    - 2 secondary: fully remote vs hybrid, and hybrid vs on-site. Report the differences with intervals, but present them as description of the ordering of the three patterns, not as confirmatory tests.
    - 15 exploratory: the three pairwise pattern differences within each of the five job families. Report these as a table of family-specific differences in means, clearly labelled exploratory, with no significance claims. The job-family table carries n and mean but no SD: establish whether SDs or standard errors for these cells exist in the environment; if not, report point differences only and state that no intervals can be computed from the summary tables. If you attach any uncertainty measure, say whether it is adjusted for multiplicity.

    5. Role of the job-family (subgroup) results
    All job-family results are exploratory. Use them to (a) describe how absence varies by family and pattern, and (b) check descriptively whether the direction of the primary comparison is consistent across the five families (e.g. in how many families the fully remote mean is below the on-site mean). Job family is the only variable available for this; describe it as a coarse consistency check, not as adjustment for confounding. Contracted pattern was not assigned, so the write-up must present the results as differences associated with contracted working pattern, not as the effect of moving staff to remote work.

    6. What counts as an answer
    The question is answered if you can report the fully remote and on-site means, their difference, and a 95% confidence interval, with a plain statement of direction: fully remote staff recorded fewer / more / no detectably different mean sickness days than on-site staff. "Reduce" is supported only if the fully remote mean is lower and the interval excludes zero. If the interval includes zero, report the comparison as inconclusive at the precision available, not as evidence of no difference.

    7. If the data cannot answer the question as asked
    Report instead: (a) the descriptive means, SDs and counts from the by-pattern table; (b) exactly what prevents an answer — e.g. SDs missing so no interval can be computed, counts not reconciling to 5,600, zero-absence staff apparently excluded, or pattern classification ambiguous for part-year staff; and (c) what additional summary statistics or classification rules would be needed. Do not substitute the exploratory job-family results for the primary comparison, and do not go beyond reporting the association and the consistency check when addressing the causal wording of the question.
