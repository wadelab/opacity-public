    ## Request

    NHS England want to know whether the pharmacist-led structured medication
    review (SMR) programme reduced unplanned hospital admissions among people
    aged 75 and over, and whether any integrated care board (ICB) areas stand
    out. Please compare 12-month unplanned admission rates between SMR
    recipients and matched non-recipients, overall and by ICB.

    ## Structure of the data pack

    ### Unplanned admissions within 12 months, by ICB

    Columns: ICB | SMR n | SMR admitted | Matched n | Matched admitted
    Row labels, in order: ICB A; ICB B; ICB C; ICB D; ICB E; ICB F; ICB G; ICB H; ICB I; ICB J; ICB K; ICB L; ICB M; ICB N; ICB O; ICB P; ICB Q; ICB R; ICB S; ICB T; Total
  reply: |-
    Analysis request: SMR programme and unplanned hospital admissions, people aged 75 and over

    Background. NHS England wants to know whether the pharmacist-led structured medication review (SMR) programme reduced unplanned hospital admissions among people aged 75 and over, and whether any integrated care board (ICB) areas stand out. The data pack contains one summary table, "Unplanned admissions within 12 months, by ICB", with columns ICB, SMR n, SMR admitted, Matched n, Matched admitted, and rows for ICBs A to T plus a Total row. Everything below is specified on that table only.

    1. Primary comparison. Compare the 12-month unplanned admission rate of SMR recipients aged 75+ with that of matched non-recipients aged 75+, overall, using the Total row. The outcome is the proportion of each group with an unplanned admission within 12 months. Report, for each group: n, number admitted, and the proportion; then the difference in proportions (SMR minus matched) with a 95% confidence interval, and the ratio of proportions (SMR divided by matched) with an interval. State the method used for the intervals. The overall difference with its interval is the single primary result for the question.

    2. Unit of analysis. The unit is the individual person aged 75+ (SMR recipient or matched non-recipient). The table gives counts of these individuals aggregated by ICB, so all estimates are group-level proportions and comparisons of proportions. No person-level or covariate-adjusted analysis is possible from this pack.

    3. Denominators. For each row including Total: SMR rate = SMR admitted / SMR n, i.e. people in the SMR group with an unplanned admission within 12 months, out of all people in the SMR group. Matched rate = Matched admitted / Matched n, defined the same way for the matched non-recipient group. Before computing anything, establish from the data provider: (a) whether "admitted" counts people with at least one unplanned admission in 12 months, or counts admission episodes - if episodes, the measure is admissions per person, not a proportion, and the write-up must say so and adjust the language accordingly; (b) the start of the 12-month window (SMR date for recipients and matched index date for non-recipients, or another rule); (c) whether SMR n and Matched n are restricted to people aged 75+; (d) whether the Total row equals the sum of the 20 ICB rows - check this and report any discrepancy; (e) the ratio of Matched n to SMR n in each row, and whether it varies, since this bears on how the matching was done.

    4. Number of comparisons and how to handle them. The request implies 21 comparisons on a single outcome at a single time point: one primary overall comparison (Total row) and 20 secondary ICB-level comparisons (ICBs A to T). There are no further outcomes, groups, areas or periods in this pack. Treat the overall comparison as the one confirmatory result for the question of whether the programme reduced unplanned admissions. Treat all 20 ICB comparisons as secondary and exploratory: report every one of them, not only notable ones, each with both proportions, the difference and a 95% interval. Do not apply a formal multiple-comparison adjustment, but state explicitly that 20 comparisons are being made and that some intervals will exclude zero by chance alone; no single ICB result should be presented as a finding.

    5. Exploratory ICB results and "standing out". The question of whether any ICB stands out is exploratory and should be reported descriptively. List any ICB whose difference runs in the opposite direction to the overall difference, or whose difference is large relative to both the overall difference and the spread of the other ICBs, and label these as hypothesis-generating only. Do not rank ICBs or name best and worst areas as a conclusion. Also establish from the data provider whether matched non-recipients were matched to recipients within the same ICB; if not, say so, as it weakens interpretation of the ICB-level comparisons.

    6. What would count as an answer. The question is answered as "yes, reduced" if the overall SMR proportion is lower than the overall matched proportion with the 95% interval for the difference excluding zero (equivalently the ratio below 1 with its interval excluding 1); as "no clear difference" if the interval includes zero; and as "increased" if the SMR proportion is higher with the interval excluding zero. Report the direction, size and interval whatever they show. State in the write-up that this is a comparison of matched groups, not a randomised comparison, and that the quality of the matching cannot be checked from this table, so any difference is consistent with a programme effect but is not proof of one.

    7. If the data cannot answer the question as asked. If any denominator for the Total row is zero, missing or otherwise unusable, or the definitions in point 3 cannot be established, report that the overall comparison cannot be made, give whatever group counts are available, and do not substitute a different outcome, window or population. If individual ICB rows have missing or zero denominators, report those ICBs as not estimable rather than dropping them silently. If the Total row and the sum of the ICB rows disagree, report both figures and the discrepancy, and say which was used. Do not draw conclusions about time trends, causes, or ICBs not listed in the table.
