  reply: |-
    To the analyst

    The researcher's question, in full: thirty dairy farms reported monthly antibiotic use for three years; fifteen received quarterly veterinary advisory visits from the start of the second year; did the visits reduce antibiotic use? The remaining fifteen farms are the comparison group. Please analyse the summary tables and write the analysis up for release to the researcher, specified as follows.

    PRIMARY COMPARISON

    Outcome: antibiotic use intensity, mean mg per kg population-corrected unit (mg per PCU). Note that the available outcome is use per PCU (intensity, standardised for animal biomass), not total milligrams used; if the researcher's intent was total use, the tables cannot answer that, and you should say so.

    Comparison: the change in mean use from the year-one baseline to the year-two-and-three period, between the advisory group and the comparison group — a difference in changes: (advisory post minus advisory baseline) minus (comparison post minus comparison baseline). The visits count as reducing use only if the advisory group falls relative to baseline by more than the comparison group does over the same periods.

    Unit of analysis: the farm. Visits were assigned to farms, so farms are the unit for the primary comparison and for any standard errors. The monthly table's unit is the farm-month; use it to verify coverage and describe the time pattern, not as the primary unit.

    DENOMINATORS

    mg per PCU: antibiotic milligrams used, over the population-corrected unit (the kg of animal biomass at risk in the same farm-month). State this definition in the write-up.

    Group means: the monthly table's means are averages over the farm-months listed; the farm-level and baseline tables' means are averages over the farms listed. Report the farms and farm-months counts beside every mean so each figure's denominator is explicit.

    ESTABLISH THESE POINTS BEFORE RUNNING THE COMPARISON (the table structure leaves them open; do not assume them)

    1. What "period" means in the monthly table — whether periods are the three years or something finer, and whether years two and three can be separated. If they cannot, the primary comparison is baseline versus the combined year-two-and-three period, and you should state that year-specific effects cannot be estimated from these tables.
    2. Whether the farm-level table's mean covers years two and three combined per farm, and how it reconciles with the monthly table.
    3. How the group means are formed: an unweighted average of farm-month (or farm) values, or total mg divided by total PCU. These can differ when farms differ in size; report which applies.
    4. Coverage: check the Farms and Farm-months columns in every row. Confirm each group shows fifteen farms throughout, and that farm-months equal farms times months in the period (for a full year, fifteen farms times twelve months equals 180 per group). Report any shortfall as missing data and state how it was handled.
    5. How long the advisory visits ran. The request says "from the start of the second year" but not until when; if the visit schedule is available, state it; if not, note that the analysis assumes visits ran through the post period.
    6. What each SD is the SD of: farm-level values in the farm-level and baseline tables, farm-month values in the monthly table. This determines which count pairs with which SD when computing standard errors.
    7. How the fifteen advisory farms were chosen. The request does not say; do not assume random allocation. Report the baseline balance check and note that causal attribution rests on the groups being comparable apart from the visits.

    NUMBER OF COMPARISONS AND HOW TO HANDLE THEM

    The tables can support up to six group-period means (two groups by three years) and up to seventy-two group-month means (two groups by thirty-six months). Handle them as follows.

    Primary (one comparison, the only one that answers the research question): the difference in changes between the groups on mg per PCU, baseline to the year-two-and-three period.

    Secondary (report, labelled secondary, not confirmatory): the baseline difference between the groups (a balance check from the baseline table, reported whatever the outcome); the change within each group separately; and, only if years two and three are separable, the baseline-to-year-two and baseline-to-year-three differences in changes (two further comparisons).

