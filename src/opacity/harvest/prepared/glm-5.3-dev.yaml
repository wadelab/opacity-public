    To the analyst

    Researcher's question, to be kept intact in the write-up: by how much did biochemistry turnaround time change after the new analyser was installed in Laboratory 1 in April? Laboratory 2 kept its existing analyser.

    Table to use: "Median turnaround (minutes), routine biochemistry, three months before and after" (rows: Laboratory 1 (new analyser); Laboratory 2 (unchanged); columns: Samples before, Median before, Samples after, Median after).

    Primary comparison
    Laboratory 1's median turnaround in minutes for routine biochemistry samples in the three months after the new analyser was installed, compared with the three months before. Report the change as a signed difference in minutes, after minus before (a negative number means faster), together with the two medians themselves.

    Unit of analysis
    The comparison is made at laboratory level: each laboratory contributes one median per period, and each median is computed over the routine biochemistry samples that laboratory processed in that period. The underlying unit is the individual routine biochemistry sample; the "Samples before" and "Samples after" columns give the number of samples behind each median.

    Comparisons implied, and how to handle them
    The request implies exactly three figures, all from this one table, to be reported together:
    1. Laboratory 1: after median minus before median. This is the primary answer.
    2. Laboratory 2: after median minus before median. Comparator, since it kept its existing analyser.
    3. Laboratory 1's change minus Laboratory 2's change, which shows how much of Laboratory 1's change is specific to that laboratory rather than shared across both over the period.
    There are no further outcomes, subgroups, areas or time points in this pack, so no other comparisons are implied. With two laboratories and period-level medians, report descriptive differences only: no significance tests, and note that the pack does not support a measure of uncertainty around the medians. Treat the difference between the two changes as descriptive; the pack holds only medians and counts, so it does not allow adjustment for differences between the laboratories (for example in case mix or volume), and the write-up should say so.

    Secondary and exploratory results
    The Laboratory 2 before/after change and the difference between the two changes are secondary: report them as context, clearly labelled as comparator results, not as the answer to the researcher's question. No subgroup, area-level or within-period (for example monthly) results exist in this pack; if you can derive any from data held in the environment, treat them as exploratory, report them separately from the primary comparison, and label them exploratory.

    Denominators
    Each median is based on the routine biochemistry samples processed by that laboratory in that period. Report the "Samples before" and "Samples after" counts with every median and every difference, so the base of each figure is visible; if counts differ substantially between periods or laboratories, note this as context. Establish from the definitions held with the table what these counts cover (for example whether any sample types, repeats or failed samples are excluded) and state it; if it cannot be established, say so rather than assuming.

    Points to establish before reporting
    - The exact calendar months making up the "three months before" and "three months after" windows, and how the installation month (April) is handled: included in the after window, excluded, or split. The table title does not fix this; establish it from the table's definitions and state it in the write-up. If it cannot be established, report the ambiguity.
    - The definition of turnaround used (for example sample receipt to result, or request to validation) and whether it is the same for both laboratories and both periods. State it, or note that the pack does not define it.
    - The scope of "biochemistry" in the researcher's question. The pack covers routine biochemistry only, so the answer will be scoped to routine biochemistry; flag in the write-up that other biochemistry work is not covered, so the researcher can see the limits of the answer.

    What counts as an answer
    A complete answer states: Laboratory 1's median turnaround before and after, in minutes, with the sample counts; the signed change in minutes and its direction; the same figures for Laboratory 2; and the difference between the two changes. The primary answer to the researcher's question is Laboratory 1's signed change.

    If the data cannot answer the question as asked
    If any median or sample count is missing or suppressed, if a count is too small to treat the median as stable, or if the before/after windows cannot be defined relative to the April installation, report exactly what is available, state explicitly that the question cannot be answered as asked, and name the specific limitation. Do not replace the requested before/after change with a different comparison (for example a between-laboratory difference in a single period) without saying so.
